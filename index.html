<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isha Yoga Center · 3D Virtual Tour</title>
    <meta
      name="description"
      content="Explore Adiyogi, Dhyanalinga, and Linga Bhairavi on an interactive 3D tour of the Isha Yoga Center in Coimbatore."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Isha Yoga Center · 3D Virtual Tour" />
    <meta
      property="og:description"
      content="Walk or fly around the campus and explore Adiyogi, Dhyanalinga, and Linga Bhairavi."
    />
    <meta property="og:url" content="https://sadhgurum.github.io/isha-tour/" />
    <meta
      property="og:image"
      content="https://sadhgurum.github.io/isha-tour/social-preview.jpg"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="An aerial view of the Dhyanalinga dome in the Isha Yoga Center 3D virtual tour."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/adiyogi-favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="landmark-labels" class="ui" aria-hidden="true"></div>

    <div id="loader">
      <div id="foothills" class="om">Velliangiri foothills</div>
      <h1>Isha Yoga Center</h1>
      <div id="bar"><i></i></div>
      <div id="step">Loading the 3D engine…</div>
    </div>

    <div id="title" class="ui">
      <img src="/adiyogi-mark.png" alt="" width="52" height="52" />
      <div>
        <h1>Isha Yoga Center</h1>
        <p id="subtitle">Coimbatore · Velliangiri foothills · 1:1 scale</p>
      </div>
    </div>
    <div id="moods" class="ui">
      <label id="language-picker">
        <span id="language-label" class="visually-hidden">Language</span>
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <circle cx="12" cy="12" r="9" />
          <ellipse cx="12" cy="12" rx="4" ry="9" />
          <path d="M3 12h18" />
        </svg>
        <span id="language-code" aria-hidden="true" dir="ltr">en</span>
        <select id="language" dir="auto" disabled></select>
      </label>
      <select id="mood" disabled></select>
    </div>
    <div id="nav" class="ui"></div>
    <div id="info" class="ui">
      <h2></h2>
      <p></p>
    </div>
    <div id="hint" class="ui"></div>
    <button id="navBtn" class="ui">Locations</button>
    <div id="joy"><i></i></div>
    <div id="touch-flight">
      <button id="touch-rise" type="button"></button>
      <button id="touch-descend" class="touch-arrow" type="button" hidden>
        ↓
      </button>
    </div>

    <script type="module" src="/src/tour.js"></script>
  </body>
</html>
