<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isha Yoga Center · 3D Virtual Tour</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="loader">
      <div class="om">ISHA YOGA CENTER</div>
      <h1 id="foothills">Velliangiri foothills</h1>
      <div id="bar"><i></i></div>
      <div id="step">Loading the 3D engine…</div>
    </div>

    <div id="title" class="ui">
      <h1>Isha Yoga Center</h1>
      <p id="subtitle">Coimbatore · Velliangiri foothills · 1:1 scale</p>
      <p id="credit">Model by Claude</p>
    </div>
    <div id="moods" class="ui">
      <label id="language-picker">
        <span id="language-label" class="visually-hidden">Language</span>
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <circle cx="12" cy="12" r="9" />
          <ellipse cx="12" cy="12" rx="4" ry="9" />
          <path d="M3 12h18" />
        </svg>
        <span id="language-code" aria-hidden="true" dir="ltr">en</span>
        <select id="language" dir="auto" disabled></select>
      </label>
    </div>
    <div id="nav" class="ui"></div>
    <div id="info" class="ui">
      <h2></h2>
      <p></p>
    </div>
    <div id="hint" class="ui"></div>
    <button id="navBtn" class="ui">Locations</button>
    <div id="joy"><i></i></div>

    <script type="module" src="/src/tour.js"></script>
  </body>
</html>
